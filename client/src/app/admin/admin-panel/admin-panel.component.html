<h2>Admin panel</h2>
<div class="tab-panel">
  <tabset class="member-tabset">
    <tab heading="User management" *appHasRole="['Admin']">
      <div class="container">
        <app-user-management></app-user-management>
      </div>
    </tab>

    <tab heading="Photo management" *appHasRole="['Admin', 'Moderator']">
      <div class="container">
        <app-photo-management></app-photo-management>
      </div>
    </tab>
    <tab heading="Tag management" *appHasRole="['Admin', 'Moderator']">
      <div class="container">
        <app-tag-management></app-tag-management>
      </div>
    </tab>

    <tab heading="Statistics" *appHasRole="['Admin', 'Moderator']">
      <div class="container">
        <app-statistics></app-statistics>
      </div>
    </tab>

    <tab heading="ApprovedFeed" *appHasRole="['Admin', 'Moderator']">
      <div class="container">
        <app-approved-feed />
      </div>
    </tab>
  </tabset>
</div>
